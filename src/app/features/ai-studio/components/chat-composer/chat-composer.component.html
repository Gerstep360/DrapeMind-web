<div class="composer-card" [class.composer-card--busy]="isBusy">
  <!-- ACTIVE COMMAND BAR (WITH LIME BADGE) -->
  @if (activeCommand()) {
    <div class="composer-command-bar">
      <span class="composer-command-pill">
        <span class="command-pill-prefix">/{{ activeCommand() }}</span>
        <button type="button" class="command-pill-close" (click)="clearActiveCommand()" title="Quitar comando">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </span>
      <span class="composer-command-tip">Personaliza tu consulta antes de enviar</span>
    </div>
  }

  <!-- SLASH AUTOCOMPLETE POPUP (WHEN TYPING '/') -->
  @if (isSlashMenuOpen()) {
    <div class="slash-commands-popover" (click)="$event.stopPropagation()">
      <div class="slash-popover-header">Comandos de Altair</div>
      @for (cmd of slashCommands; track cmd.label) {
        <button type="button" class="slash-command-item" (click)="selectSlashCommand(cmd)">
          <span class="slash-cmd-badge">/{{ cmd.label }}</span>
          <span class="slash-cmd-desc">{{ cmd.desc }}</span>
        </button>
      }
    </div>
  }

  <!-- TOP: TEXTAREA -->
  <div class="composer-input-row">
    <textarea
      #promptTextarea
      [formControl]="prompt"
      [placeholder]="activeCommand() ? 'Escribe tu consulta para /' + activeCommand() + '...' : 'Pregunta a Altair sobre prendas, outfits o estilo...'"
      aria-label="Mensaje para Altair"
      rows="1"
      (keydown)="onKeydown($event)"
      (input)="onInputChange()"
      [disabled]="isBusy"
    ></textarea>
  </div>

  <!-- POPOVER MENU FOR '+' BUTTON (ALTAIR FUNCTIONAL CAPABILITIES) -->
  @if (isPlusMenuOpen()) {
    <div class="composer-popover plus-popover" (click)="$event.stopPropagation()">
      <button type="button" class="popover-item" (click)="executeOutfitBuilder()">
        <span class="popover-icon icon-lime">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          </svg>
        </span>
        <div class="popover-copy">
          <strong>Diseñar outfit a medida</strong>
          <small>Llenar cuestionario guiado de ocasión y tallas</small>
        </div>
      </button>

      <button type="button" class="popover-item" (click)="executeClosetAnalysis()">
        <span class="popover-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
          </svg>
        </span>
        <div class="popover-copy">
          <strong>Analizar mi perchero</strong>
          <small>Revisión y combinaciones de tus guardados</small>
        </div>
      </button>

      <button type="button" class="popover-item" (click)="executeBudgetLook()">
        <span class="popover-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </span>
        <div class="popover-copy">
          <strong>Look por presupuesto</strong>
          <small>Outfit optimizado por menos de Bs 400</small>
        </div>
      </button>

      <button type="button" class="popover-item" (click)="executeCatalogExplore()">
        <span class="popover-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <div class="popover-copy">
          <strong>Explorar catálogo</strong>
          <small>Piezas exclusivas y novedades de showroom</small>
        </div>
      </button>
    </div>
  }

  <!-- POPOVER MENU FOR REAL MODEL SELECTION -->
  @if (isModeMenuOpen()) {
    <div class="composer-popover mode-popover" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="popover-item"
        [class.popover-item--active]="activeModel === 'mini'"
        (click)="selectModel('mini')"
      >
        <span class="popover-icon mode-icon--mini">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </span>
        <div class="popover-copy">
          <div class="popover-title-row">
            <strong>Altair Mini</strong>
            <span class="badge-mini">Ultrarrápido</span>
          </div>
          <small>Solo modelo Scout · Respuestas inmediatas en ~1-2s</small>
        </div>
        @if (activeModel === 'mini') {
          <span class="popover-check">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
        }
      </button>

      <button
        type="button"
        class="popover-item"
        [class.popover-item--active]="activeModel === 'dynamic'"
        (click)="selectModel('dynamic')"
      >
        <span class="popover-icon mode-icon--dynamic">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          </svg>
        </span>
        <div class="popover-copy">
          <div class="popover-title-row">
            <strong>Dinámico</strong>
            <span class="badge-recommended">Recomendado</span>
          </div>
          <small>Scout rápido con delegación profunda a Gemma si se requiere</small>
        </div>
        @if (activeModel === 'dynamic') {
          <span class="popover-check">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
        }
      </button>

      <button
        type="button"
        class="popover-item"
        [class.popover-item--active]="activeModel === 'gemma'"
        (click)="selectModel('gemma')"
      >
        <span class="popover-icon mode-icon--gemma">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a4 4 0 0 1 4 4c0 1.95-1.4 3.58-3.25 3.93l-.75 2.07h2a2 2 0 0 1 2 2v6H8v-6a2 2 0 0 1 2-2h2l-.75-2.07A4.002 4.002 0 0 1 12 2Z"/>
          </svg>
        </span>
        <div class="popover-copy">
          <div class="popover-title-row">
            <strong>Altair (Solo Gemma)</strong>
          </div>
          <small>Razonamiento exhaustivo Gemma 9B (~110s)</small>
        </div>
        @if (activeModel === 'gemma') {
          <span class="popover-check">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
        }
      </button>
    </div>
  }

  <!-- INTEGRATED BOTTOM TOOLBAR -->
  <div class="composer-toolbar">
    <div class="composer-toolbar__left">
      <!-- [+] ACTION BUTTON -->
      <button
        type="button"
        class="composer-btn-plus"
        [class.composer-btn-plus--active]="isPlusMenuOpen()"
        (click)="togglePlusMenu()"
        title="Herramientas y opciones de Altair"
        aria-label="Abrir menú de herramientas"
      >
        <span class="plus-sign">+</span>
      </button>

      <!-- MODEL SELECTOR CHIP -->
      <button
        type="button"
        class="composer-mode-chip"
        [class.composer-mode-chip--active]="isModeMenuOpen()"
        (click)="toggleModeMenu()"
        title="Cambiar modelo de Altair"
      >
        @if (activeModel === 'mini') {
          <svg class="sparkle mode-svg--mini" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          <span>Altair Mini</span>
        } @else if (activeModel === 'gemma') {
          <svg class="sparkle mode-svg--gemma" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a4 4 0 0 1 4 4c0 1.95-1.4 3.58-3.25 3.93l-.75 2.07h2a2 2 0 0 1 2 2v6H8v-6a2 2 0 0 1 2-2h2l-.75-2.07A4.002 4.002 0 0 1 12 2Z"/>
          </svg>
          <span>Altair (Gemma)</span>
        } @else {
          <svg class="sparkle" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          </svg>
          <span>Dinámico</span>
        }
        <span class="chevron">▾</span>
      </button>
    </div>

    <div class="composer-toolbar__right">
      <!-- VOICE DICTATION TRIGGER (WEB SPEECH API) -->
      <button
        type="button"
        class="composer-btn-icon composer-btn-mic"
        [class.composer-btn-mic--active]="isListening()"
        (click)="toggleVoiceRecognition()"
        [title]="isListening() ? 'Detener dictado por voz' : 'Dictar por voz'"
        aria-label="Dictar por voz"
      >
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>

      <!-- CIRCULAR SEND BUTTON (LIME WHEN ACTIVE / STOP WHEN BUSY) -->
      @if (isBusy) {
        <button
          type="button"
          class="composer-circle-send composer-circle-send--stop"
          (click)="cancel()"
          title="Detener respuesta de Altair"
          aria-label="Detener respuesta"
        >
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
            <rect width="18" height="18" x="3" y="3" rx="3"/>
          </svg>
        </button>
      } @else {
        <button
          type="button"
          class="composer-circle-send"
          [class.composer-circle-send--active]="prompt.valid && prompt.value.trim().length > 0"
          [disabled]="prompt.invalid || !prompt.value.trim()"
          (click)="send()"
          title="Enviar mensaje (Enter)"
          aria-label="Enviar mensaje"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      }
    </div>
  </div>
</div>
