<!-- FILTERS TOOLBAR WITH INTEGRATED AI STYLIST FILTER -->
<section class="catalog-tools" aria-label="Filtros de catalogo">
  <div class="search-and-gender">
    <label class="search-field">
      <span class="sr-only">Buscar prendas</span>
      <svg
        class="search-svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input
        [formControl]="search"
        type="search"
        placeholder="Buscar por polera, camisa, jeans, color o estilo..."
      />
    </label>

    <div class="ai-filter-trigger-wrap">
      <button
        type="button"
        class="btn-ai-trigger"
        [class.active]="aiPanelOpen()"
        (click)="toggleAiPanel()"
      >
        <span class="ai-sparkle">✦</span>
        <span>Filtro Stylist IA</span>
      </button>
    </div>

    <div class="gender-chips" aria-label="Filtrar por género">
      @for (g of ['TODOS', 'HOMBRE', 'MUJER', 'UNISEX']; track g) {
        <button
          type="button"
          class="chip"
          [class.active]="selectedGender() === g"
          (click)="chooseGender(g)"
        >
          {{ g }}
        </button>
      }
    </div>
  </div>

  @if (aiPanelOpen()) {
    <app-altair-launcher
      title="Diseña desde la colección"
      description="Describe con libertad el look, presupuesto o combinación que necesitas."
      [context]="altairCatalogContext()"
    />
  }

  <div class="category-tabs">
    <button
      type="button"
      [class.active]="selectedCategory() === null"
      (click)="chooseCategory(null)"
    >
      Todas las Categorías
    </button>
    @for (category of categories(); track category.id) {
      <button
        type="button"
        [class.active]="selectedCategory() === category.id"
        (click)="chooseCategory(category.id)"
      >
        {{ category.nombre }}
      </button>
    }
  </div>

  <div class="price-chips" aria-label="Filtrar por presupuesto">
    <span class="filter-caption">Presupuesto:</span>
    <button type="button" [class.active]="maxPriceFilter() === null" (click)="chooseMaxPrice(null)">
      Cualquier precio
    </button>
    <button type="button" [class.active]="maxPriceFilter() === 200" (click)="chooseMaxPrice(200)">
      Hasta Bs 200
    </button>
    <button type="button" [class.active]="maxPriceFilter() === 400" (click)="chooseMaxPrice(400)">
      Hasta Bs 400
    </button>
    <button type="button" [class.active]="maxPriceFilter() === 750" (click)="chooseMaxPrice(750)">
      Hasta Bs 750
    </button>
  </div>
</section>
