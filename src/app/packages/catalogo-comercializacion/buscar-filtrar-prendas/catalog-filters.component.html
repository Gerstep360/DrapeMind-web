<section class="catalog-tools" aria-label="Buscar y filtrar prendas">
  <div class="catalog-tools__top">
    <label class="catalog-search"
      ><svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        aria-hidden="true"
      >
        <circle cx="10.5" cy="10.5" r="7.5" />
        <path d="m16 16 5 5" /></svg
      ><span class="sr-only">Buscar prendas</span
      ><input
        [formControl]="search"
        type="search"
        maxlength="150"
        placeholder="Buscar una prenda, color o marca"
    /></label>
    <div class="gender-tabs" aria-label="Filtrar por género">
      @for (
        item of [
          { id: 'TODOS', label: 'Todo' },
          { id: 'MUJER', label: 'Mujer' },
          { id: 'HOMBRE', label: 'Hombre' },
          { id: 'UNISEX', label: 'Unisex' },
        ];
        track item.id
      ) {
        <button
          type="button"
          [class.active]="selectedGender() === item.id"
          [attr.aria-pressed]="selectedGender() === item.id"
          (click)="chooseGender(item.id)"
        >
          {{ item.label }}
        </button>
      }
    </div>
    <button
      type="button"
      class="altair-help"
      [attr.aria-expanded]="aiPanelOpen()"
      (click)="toggleAiPanel()"
    >
      <span aria-hidden="true">✦</span> ¿Lo combinamos?
    </button>
  </div>
  <div class="catalog-tools__bottom">
    <div class="category-tabs" aria-label="Categorías">
      <button
        type="button"
        [class.active]="selectedCategory() === null"
        [attr.aria-pressed]="selectedCategory() === null"
        (click)="chooseCategory(null)"
      >
        Todas las prendas
      </button>
      @for (category of categories(); track category.id) {
        <button
          type="button"
          [class.active]="selectedCategory() === category.id"
          [attr.aria-pressed]="selectedCategory() === category.id"
          (click)="chooseCategory(category.id)"
        >
          {{ category.nombre }}
        </button>
      }
    </div>
    <label class="budget-select"
      ><span>Precio</span
      ><select
        #budget
        [value]="maxPriceFilter() ?? ''"
        (change)="chooseMaxPrice(budget.value ? +budget.value : null)"
        aria-label="Filtrar por presupuesto"
      >
        <option value="">Cualquier precio</option>
        <option value="200">Hasta Bs 200</option>
        <option value="400">Hasta Bs 400</option>
        <option value="750">Hasta Bs 750</option>
      </select></label
    >
  </div>
  @if (aiPanelOpen()) {
    <app-altair-launcher
      title="Un look que va contigo"
      description="Cuéntame qué tienes en mente y te ayudo a encontrarlo."
      [context]="altairCatalogContext()"
    />
  }
</section>
