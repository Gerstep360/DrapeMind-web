@if (open) {
  <section
    class="altair-launcher"
    [class.altair-launcher--modal]="modal"
    aria-label="Asistente Altair"
  >
    @if (modal) {
      <button
        class="altair-launcher__scrim"
        type="button"
        aria-label="Cerrar Altair"
        (click)="closed.emit()"
      ></button>
    }
    <div class="altair-launcher__surface">
      <header class="altair-launcher__header">
        <span class="altair-launcher__mark" aria-hidden="true">✦</span>
        <div>
          <p>Tu asistente de estilo</p>
          <h2>{{ title }}</h2>
          <span>{{ description }}</span>
        </div>
        @if (modal) {
          <button
            class="altair-launcher__close"
            type="button"
            aria-label="Cerrar"
            (click)="closed.emit()"
          >
            ×
          </button>
        }
      </header>
      <app-chat-composer


        (sendMessage)="submit($event)"
        (openOutfitBuilder)="openOutfitBuilder()"
      />
      <p class="altair-launcher__foot">Continuaremos la conversación con Altair.</p>
    </div>
  </section>
}
