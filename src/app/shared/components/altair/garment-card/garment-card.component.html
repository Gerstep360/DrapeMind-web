<article class="garment-pick" [style.animation-delay]="index * 0.04 + 's'">
  <button
    type="button"
    class="garment-pick__detail"
    (click)="onCardClick()"
    [attr.aria-label]="'Ver detalles de ' + item.nombre"
  >
    <span class="garment-pick__photo">
      <app-product-media [src]="cardImageUrl()" [label]="item.nombre" />
    </span>
    <span class="garment-pick__info">
      <strong class="garment-pick__name">{{ item.nombre }}</strong>
      @if (item.color || item.talla) {
        <span class="garment-pick__variant"
          >{{ item.color }}
          @if (item.color && item.talla) {
            ·
          }
          @if (item.talla) {
            Talla {{ item.talla }}
          }
        </span>
      }
      @if (item.accion === 'VER_RESERVA') {
        <span class="garment-pick__status">{{ item.motivo }}</span>
      } @else {
        <span class="garment-pick__price">Bs {{ item.precio | number: '1.2-2' }}</span>
      }
      @if (
        item.motivo &&
        item.motivo !== 'Variante consultada en el catálogo' &&
        item.accion === 'AGREGAR'
      ) {
        <span class="garment-pick__reason">{{ item.motivo }}</span>
      }
    </span>
  </button>
  <button
    type="button"
    class="garment-pick__action"
    (click)="onQuickAddClick($event)"
    [disabled]="item.accion === 'AGREGAR' && item.stock_disponible === 0"
    [attr.aria-label]="
      item.accion === 'AGREGAR' ? 'Añadir ' + item.nombre + ' al carrito' : 'Revisar ' + item.nombre
    "
    [title]="item.accion === 'AGREGAR' ? 'Añadir al carrito' : 'Ver detalles'"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      @if (item.accion === 'AGREGAR') {
        <path d="M12 5v14M5 12h14" />
      } @else {
        <path d="m9 6 6 6-6 6" />
      }
    </svg>
  </button>
</article>
