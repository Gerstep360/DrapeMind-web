<article class="product-card">
  <div class="product-card__visual">
    <button
      class="favorite-toggle"
      type="button"
      [class.favorite-toggle--active]="favorite"
      (click)="toggleFavorite($event)"
      [attr.aria-label]="favorite ? 'Quitar de favoritos' : 'Guardar en favoritos'"
    >
      <svg
        width="19"
        height="19"
        viewBox="0 0 24 24"
        [attr.fill]="favorite ? 'currentColor' : 'none'"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path
          d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"
        />
      </svg>
    </button>
    <button
      class="product-card__image"
      type="button"
      (click)="open()"
      [attr.aria-label]="'Ver ' + product.nombre"
    >
      <app-product-media [src]="imageUrl()" [label]="product.nombre" />
    </button>
  </div>
  <div class="product-card__body">
    <p class="brand-name">{{ product.marca || 'DrapeMind' }}</p>
    <button class="product-card__name" type="button" (click)="open()">{{ product.nombre }}</button>
    <div class="product-card__price-row">
      <strong class="price-val">Bs {{ product.precio | number: '1.2-2' }}</strong
      ><span class="stock-label">{{
        (product.stock_disponible ?? 0) > 0 ? 'Disponible' : 'Agotado'
      }}</span>
    </div>
    <button class="select-btn" type="button" (click)="open()">
      <span>{{ (product.stock_disponible ?? 0) > 0 ? 'Elegir talla' : 'Ver prenda' }}</span
      ><span aria-hidden="true">↗</span>
    </button>
  </div>
</article>
