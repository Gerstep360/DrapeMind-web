map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name 157.173.102.129 localhost;

    client_max_body_size 64M;

    location = /DrapeMind {
        return 301 /DrapeMind/;
    }

    location = /DrapeMind/config.json {
        alias /var/www/drapemind/browser/config.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /DrapeMind/api/ {
        proxy_pass http://127.0.0.1:8045/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /DrapeMind;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /DrapeMind/static/ {
        proxy_pass http://127.0.0.1:8045/static/;
        proxy_set_header Host $host;
    }

    location /DrapeMind/health/ {
        proxy_pass http://127.0.0.1:8045/health/;
        proxy_set_header Host $host;
    }

    location /DrapeMind/docs {
        proxy_pass http://127.0.0.1:8045/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /DrapeMind;
    }

    location /DrapeMind/redoc {
        proxy_pass http://127.0.0.1:8045/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /DrapeMind;
    }

    location /DrapeMind/ {
        alias /var/www/drapemind/browser/;
        index index.html;
        try_files $uri $uri/ /DrapeMind/index.html;
    }
}
